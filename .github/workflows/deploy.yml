name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - master

env:
  KOBWEB_CLI_VERSION: 0.9.21

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------
      # PHASE 1: Checkout & Setup Inshallah.
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v7 # 6

      - name: Set up Java
        uses: actions/setup-java@v6 # 5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        # Needed for linux OS Inshallah
        run: chmod +x gradlew

      # --------------------------------------------------
      # PHASE 2: Download Kobweb CLI and it's dependencies Inshallah
      # --------------------------------------------------
      - name: Query Browser Cache ID
        id: browser-cache-id
        run: echo "value=$(./gradlew -q :webApp:kobwebBrowserCacheId)" >> $GITHUB_OUTPUT

      - name: Cache Browser Dependencies
        uses: actions/cache@v6 # 4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-cache-id.outputs.value }}

      - name: Fetch kobweb
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "varabyte/kobweb-cli"
          tag: "v${{ env.KOBWEB_CLI_VERSION }}"
          fileName: "kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip"
          tarBall: false
          zipBall: false

      - name: Unzip kobweb
        run: unzip kobweb-${{ env.KOBWEB_CLI_VERSION }}.zip

      # --------------------------------------------------
      # PHASE 3: Prepare for deployment Inshallah
      # --------------------------------------------------
      - name: Run export to prepare for deployment Inshallah
        run: |
          cd webApp
          ../kobweb-${{ env.KOBWEB_CLI_VERSION }}/bin/kobweb export --notty --layout static

      # --------------------------------------------------
      # PHASE 3: Deploy Inshallah
      # --------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: wenApp/.kobweb/site # The default output directory where Kobweb puts the exported production site
          branch: gh-pages # The target branch GitHub Pages uses to host your web site
          clean: true # Automatically clears old site files in gh-pages so things stay organized
